<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nami Japanese - Writing Practice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#e57373",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1a",
                        "inverse-surface": "#2f312f",
                        "tertiary-fixed": "#e4e4cc",
                        "surface-container-high": "#e9e8e5",
                        "surface-variant": "#e3e2e0",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#000767",
                        "on-secondary-container": "#27308a",
                        "inverse-on-surface": "#f2f1ee",
                        "tertiary": "#5e604d",
                        "on-primary-fixed": "#410007",
                        "surface-container-low": "#f4f3f1",
                        "primary": "#a03e40",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e0e0ff",
                        "on-error": "#ffffff",
                        "outline": "#897271",
                        "on-primary-fixed-variant": "#80272b",
                        "on-primary-container": "#5e0c15",
                        "surface-container-highest": "#e3e2e0",
                        "surface": "#faf9f6",
                        "on-secondary-fixed-variant": "#343d96",
                        "secondary-fixed-dim": "#bdc2ff",
                        "inverse-primary": "#ffb3b1",
                        "surface-bright": "#faf9f6",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "on-surface": "#1a1c1a",
                        "secondary-container": "#959efd",
                        "secondary": "#4c56af",
                        "surface-dim": "#dbdad7",
                        "outline-variant": "#dcc0bf",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#969781",
                        "surface-container": "#efeeeb",
                        "on-tertiary-fixed": "#1b1d0e",
                        "on-surface-variant": "#564241",
                        "primary-fixed": "#ffdad8",
                        "surface-tint": "#a03e40",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#474836",
                        "primary-fixed-dim": "#ffb3b1",
                        "background": "#faf9f6",
                        "on-tertiary-container": "#2e2f1f",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "lg": "24px",
                        "container-padding": "20px",
                        "gutter": "16px",
                        "sm": "12px",
                        "xl": "32px",
                        "base": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-kana": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "display-kana": ["80px", {"lineHeight": "96px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #faf9f6;
            color: #1a1c1a;
            -webkit-font-smoothing: antialiased;
        }
        .washi-texture {
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            background-color: #ffffff;
        }
        .ink-stroke {
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: blur(0.4px);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top App Bar -->
<header class="bg-surface/80 backdrop-blur-md border-b border-tertiary/10 docked full-width top-0 z-50 flex justify-between items-center w-full px-container-padding py-sm">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Practice Writing</h1>
</div>
<button class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">info</span>
</button>
</header>
<main class="flex-1 flex flex-col items-center px-container-padding pt-xl pb-32 max-w-md mx-auto w-full relative">
<!-- Info Header -->
<div class="w-full mb-lg text-center fade-in">
<div class="inline-flex flex-col items-center bg-surface-container-low px-lg py-sm rounded-xl border border-tertiary/5">
<span class="font-display-kana text-[48px] leading-tight text-primary">あ</span>
<div class="flex gap-sm items-center mt-base">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-widest">a</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Hiragana</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-lg text-label-lg text-on-surface-variant">3 strokes</span>
</div>
</div>
</div>
<!-- Practice Pad Area -->
<div class="relative w-full aspect-square max-w-[350px] bg-white rounded-[32px] shadow-[0_8px_30px_rgb(76,86,175,0.06)] washi-texture overflow-hidden border border-tertiary/10 fade-in" style="animation-delay: 0.1s;">
<!-- Grid Lines (Faint Japanese Paper Style) -->
<div class="absolute inset-0 pointer-events-none border-dashed border-tertiary/10 border-r border-b" style="background-size: 50% 50%; background-image: linear-gradient(to right, #f5f5dc 1px, transparent 1px), linear-gradient(to bottom, #f5f5dc 1px, transparent 1px);"></div>
<!-- Reference Guide (Faint 'あ') -->
<div class="absolute inset-0 flex items-center justify-center opacity-[0.08] select-none pointer-events-none">
<span class="font-display-kana text-[240px] text-on-surface select-none">あ</span>
</div>
<!-- Drawing Canvas (Simulated) -->
<svg class="absolute inset-0 w-full h-full cursor-crosshair" viewbox="0 0 350 350">
<!-- User's simulated coral ink stroke -->
<path class="ink-stroke" d="M 100 150 Q 175 140 250 150" fill="none" stroke="#e57373" stroke-width="12"></path>
<path class="ink-stroke" d="M 175 80 Q 185 180 170 280" fill="none" stroke="#e57373" stroke-width="12"></path>
<path class="ink-stroke opacity-30" d="M 160 170 C 260 140 300 240 180 290 C 100 320 60 220 160 170" fill="none" stroke="#e57373" stroke-width="8"></path> <!-- Ghost of final stroke -->
</svg>
<!-- Floating Toolbar -->
<div class="absolute bottom-md left-1/2 -translate-x-1/2 flex items-center gap-md bg-surface/90 backdrop-blur-md px-md py-xs rounded-full shadow-lg border border-tertiary/5">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-all active:scale-90" onclick="undoStroke()">
<span class="material-symbols-outlined">undo</span>
</button>
<button class="h-10 px-gutter bg-primary-container text-on-primary-container rounded-full font-label-lg flex items-center gap-xs hover:shadow-md transition-all active:scale-95" onclick="showResult()">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
                    Check
                </button>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-error hover:bg-error-container/20 transition-all active:scale-90" onclick="clearPad()">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<p class="mt-lg font-body-md text-on-surface-variant text-center opacity-70">Follow the stroke order guides to complete the character.</p>
</main>
<!-- Result Overlay (Hidden by default) -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-xl bg-on-background/20 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" id="resultOverlay">
<div class="bg-surface w-full max-w-xs rounded-[32px] p-lg shadow-2xl border border-tertiary/10 transform scale-95 transition-transform duration-300" id="resultCard">
<div class="flex flex-col items-center text-center">
<div class="w-20 h-20 bg-primary-container/20 rounded-full flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">grade</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Score: 86</h3>
<p class="font-body-md text-on-surface-variant mb-xl">Nice work! Your strokes are very close to the standard form.</p>
<div class="flex flex-col w-full gap-sm">
<button class="w-full py-md bg-primary text-on-primary rounded-xl font-label-lg shadow-lg shadow-primary/20 hover:brightness-110 transition-all active:scale-95" onclick="hideResult()">
                        Try Again
                    </button>
<button class="w-full py-md bg-surface-container-high text-on-surface-variant rounded-xl font-label-lg hover:bg-surface-container-highest transition-all active:scale-95" onclick="hideResult()">
                        Done
                    </button>
</div>
</div>
</div>
</div>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface/90 backdrop-blur-lg shadow-[0_-4px_12px_rgba(76,86,175,0.05)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">menu_book</span>
<span class="font-label-sm text-label-sm">Kana</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1.5 scale-98 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">rebase_edit</span>
<span class="font-label-sm text-label-sm">Practice</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        function showResult() {
            const overlay = document.getElementById('resultOverlay');
            const card = document.getElementById('resultCard');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function hideResult() {
            const overlay = document.getElementById('resultOverlay');
            const card = document.getElementById('resultCard');
            overlay.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        function undoStroke() {
            // Simulated undo interaction
            console.log("Undo stroke");
        }

        function clearPad() {
            // Simulated clear interaction
            console.log("Clear pad");
        }

        // Simple scale animation on click for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
